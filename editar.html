
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar música</title>
    <link rel="stylesheet" href="editar.css">
</head>
<body>

    <main>

        <a href="index.html">← Voltar para a lista</a>

        <h1>Editar música</h1>

        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Digite o título da música">

        <label for="artista">Artista</label>
        <input type="text" id="artista" placeholder="Digite o nome do artista">

        <label for="genero">Gênero</label>
        <input type="text" id="genero" placeholder="Digite o gênero musical">

        <label for="ano">Ano</label>
        <input type="number" id="ano" placeholder="Digite o ano">

        <label for="duracao">Duração em minutos</label>
        <input type="number" id="duracao" placeholder="Digite a duração">

        <button type="button" id="botaoSalvar">Salvar alterações</button>

    </main>

    <script src="editar.js"></script>
</body>
</html>
